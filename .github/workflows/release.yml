name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip the publish job (build and test only)'
        type: boolean
        default: false

env:
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      package-name: ${{ steps.get-version.outputs.package-name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Compile TypeScript
        run: npm run compile
      
      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "package-name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Package extension
        run: npx @vscode/vsce package
      
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: '*.vsix'
          retention-days: 5

  test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
      
      - name: Verify VSIX package
        run: |
          echo "Verifying VSIX package..."
          ls -lh *.vsix
          unzip -l *.vsix | head -20

  publish:
    needs: [build, test]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
      
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ needs.build.outputs.version }}
          git push origin v${{ needs.build.outputs.version }}
      
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.vsix"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          generateReleaseNotes: true
          tag: v${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.package-name }} v${{ needs.build.outputs.version }}
          commit: ${{ github.sha }}
