name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip the publish job (test and build only)'
        type: boolean
        default: false
      publish_ovsx:
        description: 'Publish to Open VSX'
        type: boolean
        default: false

env:
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      package-name: ${{ steps.get-version.outputs.package-name }}
      tag-exists: ${{ steps.get-version.outputs.tag-exists }}
      vsix-filename: ${{ steps.package.outputs.vsix-filename }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Compile TypeScript
        run: npm run compile
      
      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "package-name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "tag-exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists — will skip GitHub Release"
          else
            echo "tag-exists=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION does not exist — will create GitHub Release"
          fi
      
      - name: Package extension
        id: package
        run: |
          npx @vscode/vsce package
          VSIX_FILENAME=$(ls *.vsix)
          echo "vsix-filename=$VSIX_FILENAME" >> $GITHUB_OUTPUT
          echo "Packaged: $VSIX_FILENAME"
      
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: vsix-package
          path: '*.vsix'
          retention-days: 5

  publish:
    needs: [build, test]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Download VSIX artifact
        uses: actions/download-artifact@v7
        with:
          name: vsix-package
      
      - name: Create and push tag
        if: ${{ needs.build.outputs.tag-exists == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ needs.build.outputs.version }}
          git push origin v${{ needs.build.outputs.version }}
      
      - name: Create GitHub Release
        if: ${{ needs.build.outputs.tag-exists == 'false' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.vsix"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          generateReleaseNotes: true
          tag: v${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.package-name }} v${{ needs.build.outputs.version }}
          commit: ${{ github.sha }}
      
      - name: Publish to Open VSX
        if: ${{ inputs.publish_ovsx }}
        run: npx -y ovsx publish ${{ needs.build.outputs.vsix-filename }} --pat ${{ secrets.OVSX_PAT }}
